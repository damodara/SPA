name: Test and Deploy

on:
  push:
    branches:
      - '**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: github_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_DB: github_ci
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      run: |
        python manage.py test

  # Docker Compose деплой по SSH.
  # Нужны Secrets: SERVER_IP, SSH_USER, SSH_KEY, DEPLOY_DIR, APP_ENV_FILE.
  # APP_ENV_FILE: многострочный контент .env целиком.
  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: success()

    steps:
    - uses: actions/checkout@v4

    - name: Проверка секретов деплоя
      env:
        SSH_KEY: ${{ secrets.SSH_KEY }}
        SERVER_IP: ${{ secrets.SERVER_IP }}
        SSH_USER: ${{ secrets.SSH_USER }}
        DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
        APP_ENV_FILE: ${{ secrets.APP_ENV_FILE }}
      run: |
        if [ -z "$SSH_KEY" ]; then
          echo "::error::SSH_KEY пустой или нет такого Secret. Репозиторий → Settings → Secrets and variables → Actions."
          echo "::error::В SSH_KEY должен быть ПРИВАТНЫЙ ключ (файл без .pub), целиком, с строками BEGIN/END."
          exit 1
        fi
        if [ -z "$SERVER_IP" ] || [ -z "$SSH_USER" ] || [ -z "$DEPLOY_DIR" ] || [ -z "$APP_ENV_FILE" ]; then
          echo "::error::Задайте secrets: SERVER_IP, SSH_USER, DEPLOY_DIR, APP_ENV_FILE"
          exit 1
        fi

    - name: Deploy to server (Docker Compose)
      uses: appleboy/ssh-action@v1.2.0
      env:
        APP_ENV_FILE: ${{ secrets.APP_ENV_FILE }}
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        port: 22
        timeout: 120s
        command_timeout: 20m
        envs: APP_ENV_FILE
        script: |
          set -euxo pipefail
          docker --version
          docker compose version
          cd ${{ secrets.DEPLOY_DIR }}
          test -d .git
          printf "%s\n" "$APP_ENV_FILE" > .env
          git pull origin ${{ github.ref_name }}
          docker compose pull || true
          docker compose build --pull
          docker compose up -d --remove-orphans
          docker compose exec -T web python manage.py migrate
          docker compose exec -T web python manage.py collectstatic --noinput
          docker compose ps