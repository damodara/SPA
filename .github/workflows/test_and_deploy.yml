name: Test and Deploy

on:
  push:
    branches:
      - '**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: github_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_DB: github_ci
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      run: |
        python manage.py test

  # Docker Compose деплой по SSH.
  # Нужны Secrets: SERVER_IP, SSH_USER, SSH_KEY, DEPLOY_DIR, APP_ENV_FILE.
  # APP_ENV_FILE: многострочный контент .env целиком.
  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: success()

    steps:
    - uses: actions/checkout@v4

    - name: Проверка секретов деплоя
      env:
        SSH_KEY: ${{ secrets.SSH_KEY }}
        SERVER_IP: ${{ secrets.SERVER_IP }}
        SSH_USER: ${{ secrets.SSH_USER }}
        DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
        APP_ENV_FILE: ${{ secrets.APP_ENV_FILE }}
      run: |
        echo "DEPLOY_DIR length: ${#DEPLOY_DIR}"
        printf 'DEPLOY_DIR bytes: '
        printf '%s' "$DEPLOY_DIR" | od -An -t x1
        if [ -z "$SSH_KEY" ]; then
          echo "::error::SSH_KEY пустой или нет такого Secret. Репозиторий → Settings → Secrets and variables → Actions."
          echo "::error::В SSH_KEY должен быть ПРИВАТНЫЙ ключ (файл без .pub), целиком, с строками BEGIN/END."
          exit 1
        fi
        if [ -z "$SERVER_IP" ] || [ -z "$SSH_USER" ] || [ -z "$DEPLOY_DIR" ] || [ -z "$APP_ENV_FILE" ]; then
          echo "::error::Задайте secrets: SERVER_IP, SSH_USER, DEPLOY_DIR, APP_ENV_FILE"
          exit 1
        fi

    - name: Deploy to server (Docker Compose)
      uses: appleboy/ssh-action@v1.2.0
      env:
        APP_ENV_FILE: ${{ secrets.APP_ENV_FILE }}
        DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        
        port: 22
        timeout: 120s
        command_timeout: 20m
        envs: APP_ENV_FILE,DEPLOY_DIR
        script: |
          set -euxo pipefail
          if docker info >/dev/null 2>&1; then
            DOCKER_CMD="docker"
          elif sudo -n docker info >/dev/null 2>&1; then
            DOCKER_CMD="sudo docker"
          else
            echo "No permission to access Docker daemon for current SSH user"
            exit 1
          fi
          $DOCKER_CMD --version
          $DOCKER_CMD compose version
          DEPLOY_DIR="$(printf '%s' "$DEPLOY_DIR" | tr -d '\r' | sed 's/^"//; s/"$//' | xargs)"
          if [ -z "$DEPLOY_DIR" ]; then
            echo "DEPLOY_DIR is empty after normalization"
            exit 1
          fi
          mkdir -p "$DEPLOY_DIR"
          cd "$DEPLOY_DIR"
          if [ ! -d .git ]; then
            git clone https://github.com/damodara/SPA.git .
          fi
          printf "%s\n" "$APP_ENV_FILE" > .env
          git fetch origin ${{ github.ref_name }}
          git checkout -B ${{ github.ref_name }} origin/${{ github.ref_name }}
          git reset --hard origin/${{ github.ref_name }}
          $DOCKER_CMD compose pull || true
          $DOCKER_CMD compose build --pull
          $DOCKER_CMD compose up -d --remove-orphans
          $DOCKER_CMD compose exec -T web python manage.py migrate
          $DOCKER_CMD compose exec -T web python manage.py collectstatic --noinput
          $DOCKER_CMD compose ps